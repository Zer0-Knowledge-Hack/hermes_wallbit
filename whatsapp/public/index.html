<!DOCTYPE html>
<html lang="es" class="dark h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallbit AI Dashboard — Enterprise SaaS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/app.css">
<style>[x-cloak]{display:none!important}</style>
<script type="importmap">
{
  "imports": {
    "alpinejs": "https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/module.esm.js"
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.54.1/dist/apexcharts.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
</head>
<body class="h-full overflow-hidden" x-data="appShell" x-init="init()" x-cloak>

<div class="flex h-full">

  <!-- Sidebar -->
  <aside :class="sidebarOpen ? 'w-64' : 'w-[72px]'" class="bg-sidebar border-r border-border flex flex-col shrink-0 transition-all duration-300 z-30">
    <div class="h-16 flex items-center gap-3 px-4 border-b border-border shrink-0">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-primary to-primary-light flex items-center justify-center shrink-0 shadow-glow">
        <i class="bx bx-wallet text-white text-lg"></i>
      </div>
      <div x-show="sidebarOpen" x-transition class="min-w-0">
        <div class="font-bold text-sm truncate">Wallbit AI</div>
        <div class="text-[10px] text-muted uppercase tracking-widest">Enterprise v2.0</div>
      </div>
    </div>

    <nav class="flex-1 overflow-y-auto p-3 space-y-4" id="sidebar-nav"></nav>

    <div class="p-3 border-t border-border">
      <button @click="sidebarOpen = !sidebarOpen" class="nav-link w-full justify-center">
        <i class="bx" :class="sidebarOpen ? 'bx-chevrons-left' : 'bx-chevrons-right'"></i>
        <span x-show="sidebarOpen">Colapsar</span>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- Header -->
    <header class="h-16 bg-surface/80 backdrop-blur-xl border-b border-border flex items-center px-4 lg:px-6 gap-4 shrink-0 sticky top-0 z-20">
      <button @click="sidebarOpen = !sidebarOpen" class="lg:hidden btn-ghost !p-2"><i class="bx bx-menu text-xl"></i></button>

      <!-- Breadcrumbs -->
      <div class="hidden sm:flex items-center gap-2 text-sm text-muted min-w-0">
        <i class="bx bx-home text-xs"></i>
        <span>/</span>
        <span class="text-white font-medium truncate" x-text="pageTitle"></span>
      </div>

      <div class="flex-1"></div>

      <!-- Status badges -->
      <div class="hidden md:flex items-center gap-2">
        <span class="badge-muted"><span class="w-1.5 h-1.5 rounded-full inline-block mr-1" :class="waOk ? 'bg-success' : (waStatus === 'qr' ? 'bg-warning' : 'bg-danger')"></span><span x-text="waLabel">WhatsApp</span></span>
        <span class="badge-muted"><span class="w-1.5 h-1.5 rounded-full inline-block mr-1" :class="serverOk ? 'bg-success' : 'bg-danger'"></span>Server</span>
        <span class="badge-muted"><span class="w-1.5 h-1.5 rounded-full inline-block mr-1" :class="wallbitOk ? 'bg-success' : 'bg-warning'"></span>Wallbit</span>
        <span class="badge-muted"><span class="w-1.5 h-1.5 rounded-full inline-block mr-1" :class="aiOk ? 'bg-success' : 'bg-warning'"></span>AI</span>
      </div>

      <!-- Search trigger -->
      <button @click="commandOpen = true" class="btn-ghost !py-2 hidden sm:flex items-center gap-2 text-muted">
        <i class="bx bx-search"></i>
        <span class="text-xs">Buscar...</span>
        <kbd class="px-1.5 py-0.5 rounded bg-white/5 border border-border text-[10px]">⌘K</kbd>
      </button>

      <!-- Notifications -->
      <button class="btn-ghost !p-2 relative">
        <i class="bx bx-bell text-xl"></i>
        <span x-show="notifCount > 0" class="absolute -top-0.5 -right-0.5 w-4 h-4 bg-danger rounded-full text-[10px] flex items-center justify-center" x-text="notifCount"></span>
      </button>

      <!-- User -->
      <div class="flex items-center gap-2 pl-2 border-l border-border">
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-primary to-primary-light flex items-center justify-center text-xs font-bold">A</div>
        <span class="hidden lg:block text-sm font-medium">Admin</span>
      </div>
    </header>

    <!-- Page content -->
    <main class="flex-1 overflow-y-auto p-4 lg:p-6" id="page-content"></main>
  </div>
</div>

<!-- Command Palette -->
<div x-show="commandOpen" x-transition.opacity class="fixed inset-0 z-50 flex items-start justify-center pt-[15vh] bg-black/60 backdrop-blur-sm" @keydown.escape.window="commandOpen = false">
  <div @click.outside="commandOpen = false" class="w-full max-w-lg glass-card p-2 shadow-2xl animate-slide-up">
    <div class="flex items-center gap-3 px-4 py-3 border-b border-border">
      <i class="bx bx-search text-muted text-xl"></i>
      <input x-model="commandQuery" x-ref="commandInput" @keydown.enter="runCommand()" type="text" placeholder="Buscar páginas, acciones..." class="flex-1 bg-transparent outline-none text-sm" autofocus>
      <kbd class="text-[10px] text-muted px-1.5 py-0.5 border border-border rounded">ESC</kbd>
    </div>
    <div class="max-h-64 overflow-y-auto py-2">
      <template x-for="cmd in filteredCommands" :key="cmd.id">
        <button @click="goCommand(cmd)" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm hover:bg-white/5 rounded-lg transition-colors text-left">
          <i class="bx text-lg text-primary-light" :class="cmd.icon"></i>
          <span x-text="cmd.label"></span>
        </button>
      </template>
      <p x-show="filteredCommands.length === 0" class="text-center text-muted text-sm py-4">Sin resultados</p>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm">
  <div class="glass-card p-6 w-full max-w-md mx-4 animate-slide-up">
    <div class="flex items-center justify-between mb-4">
      <h3 id="modalTitle" class="font-semibold text-lg"></h3>
      <button type="button" id="modalClose" class="btn-ghost !p-1"><i class="bx bx-x text-xl"></i></button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container" class="fixed bottom-4 right-4 z-[60] flex flex-col gap-2"></div>

<script type="module" src="/assets/js/app.js"></script>
</body>
</html>
